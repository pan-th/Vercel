<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <!-- added bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-gradient"></div>
    <div class="register-container">
        <div class="register-box">
            <a href="Landing.html" class="back-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <div class="register-header">
                <h1>Registration Form</h1>
                <p class="subtitle">Fill out the form to create your account</p>
            </div>

            <!-- registration form here, used all the required attributes from the activity -->
            <form class="register-form" action="#" method="post" autocomplete="on" target="_self">
                
                <!-- this is for the personal info part -->
                <fieldset>
                    <legend>Personal Information</legend>
                    
                    <div class="form-group">
                        <label for="fullname">Full Name *</label>
                        <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name" maxlength="50">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label for="age">Age *</label>
                        <input type="number" id="age" name="age" required min="13" max="100" placeholder="18">
                    </div>

                    <div class="form-group">
                        <label for="birthdate">Birth Date</label>
                        <input type="date" id="birthdate" name="birthdate">
                    </div>
                </fieldset>

                <!-- account details like username and password -->
                <fieldset>
                    <legend>Account Details</legend>
                    
                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" name="username" required placeholder="Choose a username" value="">
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" required placeholder="Create a strong password">
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="userid">User ID (Auto-generated)</label>
                        <!-- made this readonly so users cant edit it -->
                        <input type="text" id="userid" name="userid" value="USER123456" readonly>
                    </div>
                </fieldset>

                <!-- added preferences section with radio buttons, checkboxes, etc -->
                <fieldset>
                    <legend>Preferences</legend>
                    
                    <div class="form-group">
                        <label>Gender *</label>
                        <!-- radio buttons for gender selection -->
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="gender" value="male" required> Male
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="gender" value="female" required> Female
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="gender" value="other" required checked> Prefer not to say
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Interests</label>
                        <!-- checkboxes so users can pick multiple interests -->
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="programming"> Programming
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="design"> Design
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="interests" value="networking"> Networking
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="course">Select Course *</label>
                        <!-- dropdown for course selection -->
                        <select id="course" name="course" required>
                            <option value="">Choose a course</option>
                            <option value="bsit">BS Information Technology</option>
                            <option value="bscs">BS Computer Science</option>
                            <option value="bsis">BS Information Systems</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="color">Favorite Color</label>
                        <!-- color picker input -->
                        <input type="color" id="color" name="color" value="#5865F2">
                    </div>

                    <div class="form-group">
                        <label for="skill">Skill Level (1-10)</label>
                        <!-- range slider for skill level -->
                        <input type="range" id="skill" name="skill" min="1" max="10" value="5">
                        <span id="skillValue">5</span>
                    </div>
                </fieldset>

                <!-- feedback section with textarea -->
                <fieldset>
                    <legend>Feedback</legend>
                    
                    <div class="form-group">
                        <label for="comments">Comments or Suggestions</label>
                        <textarea id="comments" name="comments" rows="4" placeholder="Share your thoughts..."></textarea>
                    </div>
                </fieldset>

                <!-- file upload for profile pic -->
                <fieldset>
                    <legend>File Upload</legend>
                    
                    <div class="form-group">
                        <label for="profile">Upload Profile Picture</label>
                        <input type="file" id="profile" name="profile" accept="image/*">
                    </div>
                </fieldset>

                <!-- submit and reset buttons -->
                <div class="button-group">
                    <button type="submit" class="submit-btn">
                        <span>Submit</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                    <button type="reset" class="reset-btn">
                        <span>Reset</span>
                        <i class="fas fa-redo"></i>
                    </button>
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <p style="color: #9ca3af; font-size: 14px;">
                        Already have an account? 
                        <a href="login.html" style="color: #667eea; text-decoration: none; font-weight: 600;">Login</a>
                    </p>
                </div>
            </form>

            <footer class="footer">
                <div class="footer-content">
                    <p class="copyright">&copy; 2026 Nico Fred C. Hachuela. All Rights Reserved.</p>
                </div>
            </footer>
        </div>
    </div>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // toggle password visibility - show/hide feature
        document.getElementById('togglePassword').addEventListener('click', function() {
            var password = document.getElementById('password');
            var icon = this.querySelector('i');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // updates the skill value when you move the slider
        const skillRange = document.getElementById('skill');
        const skillValue = document.getElementById('skillValue');
        skillRange.addEventListener('input', function() {
            skillValue.textContent = this.value;
        });

        // handles form submission - redirects to login page after submitting
        document.querySelector('.register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // shows loading animation on button
            var button = document.querySelector('.submit-btn');
            button.style.opacity = '0.7';
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
            
            // waits a bit then goes to login page
            setTimeout(function() {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
