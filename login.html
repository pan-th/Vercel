<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio</title>
    <!-- added bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-gradient"></div>
    <div class="register-container">
        <div class="register-box">
            <a href="Landing.html" class="back-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <div class="register-header">
                <h1>Welcome Back!</h1>
                <p class="subtitle">Login to access your portfolio</p>
            </div>

            <!-- login form with email and password -->
            <form class="register-form" id="loginForm">
                <div class="form-group">
                    <label for="email">EMAIL *</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD *</label>
                    <!-- password field with show/hide button -->
                    <div class="password-container">
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div style="text-align: center; margin-top: 20px;">
                    <p style="color: #9ca3af; font-size: 14px;">
                        Don't have an account? 
                        <a href="register.html" style="color: #667eea; text-decoration: none; font-weight: 600;">Register here</a>
                    </p>
                </div>
            </form>

            <footer class="footer">
                <div class="footer-content">
                    <p class="copyright">&copy; 2026 Nico Fred C. Hachuela. All Rights Reserved.</p>
                </div>
            </footer>
        </div>
    </div>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            var password = document.getElementById('password');
            var icon = this.querySelector('i');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // handles login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // shows loading animation
            var button = document.querySelector('.submit-btn');
            button.style.opacity = '0.7';
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            
            // waits a bit then goes back to home page
            setTimeout(function() {
                window.location.href = 'Landing.html';
            }, 1500);
        });
    </script>
</body>
</html>
